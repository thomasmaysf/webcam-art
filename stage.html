<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Mirror — projector</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,monospace}
  #go{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:#0a0e14;color:#e8eef2;z-index:5;text-align:center;padding:24px;
  }
  #go p{color:#7d8a99;max-width:460px;line-height:1.6}
  #go button{
    background:#3ddc97;color:#04201a;border:none;padding:16px 28px;border-radius:8px;
    font:700 16px inherit;cursor:pointer;
  }
  canvas{display:block}
</style>
</head>
<body>
<div id="go">
  <button id="start" type="button">start camera</button>
  <p>Click once on this window. It goes fullscreen, opens the LifeCam and the mic, and follows the control deck plus the M5Stack.</p>
</div>
<script>
const bus = new BroadcastChannel("pixel-mirror");
const modeNames = ["ascii dots","color blocks","edge glow","mirror kaleido","lean pan","horizon","wedges"];
const S = {grid:14, thresh:128, hue:0, wob:0, ang:0, mir:true, inv:false, mode:0};
const micArm = {grid:true, thresh:false, hue:false, wob:false, ang:false};
const pitchArm = {grid:false, thresh:false, hue:true, wob:false, ang:false};
const leanArm = {grid:false, thresh:true, hue:false, wob:false, ang:false};
const tiltArm = {grid:false, thresh:false, hue:false, wob:false, ang:true};
const gyroArm = {grid:false, thresh:false, hue:false, wob:false, ang:true};

let video, started = false;
let micLevel = 0, micOn = false, analyser, micBuf, wave = new Uint8Array(0);
let noteHue = 0;
let roll = 0, pitch = 0, spin = 0;
let tiltZero = null;
let lastFrame = 0, lastLive = 0, frameBusy = false;

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

function wrap180(d){ return ((d + 540) % 360) - 180; }

// Degrees away from the zeroed pose. A few degrees of rest do nothing; about 28° is the full move.
function sway(deg){
  const a = Math.abs(deg) - 4;
  if(a <= 0) return 0;
  return Math.sign(deg) * clamp(a / 24, 0, 1);
}

function camAt(u, v){
  const vx = Math.floor(clamp(u, 0, 0.999) * video.width);
  const vy = Math.floor(clamp(v, 0, 0.999) * video.height);
  const i = (vy * video.width + vx) * 4;
  let r = video.pixels[i], g = video.pixels[i + 1], b = video.pixels[i + 2];
  let bright = (r + g + b) / 3;
  if(S.inv){
    bright = 255 - bright;
    r = 255 - r; g = 255 - g; b = 255 - b;
  }
  return {r, g, b, bright};
}

function wrapSigned(d, half){
  const span = half * 2;
  return ((d + half) % span + span) % span - half;
}

// Wobble and angle are both zero at the middle. The middle cell stays on the
// middle of the frame; angle turns the picture around that point, wobble
// spreads it out or pulls it in.
function cellPos(x, y, g, L, cols, rows){
  const cx = (cols - 1) / 2;
  const cy = (rows - 1) / 2;
  const dx = x - cx;
  const dy = y - cy;
  const a = L.ang * Math.PI / 180;
  const cs = Math.cos(a), sn = Math.sin(a);
  let rx = dx * cs - dy * sn;
  let ry = dx * sn + dy * cs;
  const breathe = 1 + Math.sin(frameCount * 0.08) * (L.wob / 80);
  const scale = (1 + L.wob / 40) * breathe;
  return [(cx + rx * scale) * g + g / 2, (cy + ry * scale) * g + g / 2];
}

// The older placement. A zero wobble leaves every cell on its grid point,
// so lean pan is not spun by the angle control.
function gridPos(x, y, g, L){
  const wob = L.wob * Math.sin((x + y) * 0.4 + frameCount * 0.08);
  const a = L.ang * Math.PI / 180;
  return [x * g + g / 2 + wob * Math.cos(a), y * g + g / 2 + wob * Math.sin(a)];
}

function paintBlock(px, py, s, r, g, b){
  colorMode(RGB, 255);
  fill((r + Lhue) % 256, g, b);
  colorMode(HSB, 360, 100, 100, 255);
  rect(px - s / 2, py - s / 2, s, s);
}
let Lhue = 0;

function extra(key, micSpan, pitchValue, leanK, tiltK, gyroK, lean, tip){
  return (micArm[key] ? micSpan : 0)
    + (pitchArm[key] ? pitchValue : 0)
    + (leanArm[key] ? lean * leanK : 0)
    + (tiltArm[key] ? tip * tiltK : 0)
    + (gyroArm[key] ? spin * gyroK : 0);
}

function inputs(){
  const r = roll, p = pitch;
  const mic = micOn ? micLevel : 0;
  const note = noteHue / 360;
  // Before zero, upright-for-a-Core is roll ≈ 90. After zero, both axes are degrees from that pose.
  const lean = tiltZero ? wrap180(r - tiltZero.roll) : r - 90;
  const tip = tiltZero ? wrap180(p - tiltZero.pitch) : p;
  const gridAdd = extra("grid", mic * 16, note * 20, 0.4, 0.4, 16, lean, tip);
  const threshAdd = extra("thresh", mic * 90, note * 120, 2.6, 2.6, 90, lean, tip);
  const hueAdd = extra("hue", mic * 160, noteHue, 4, 4, 160, lean, tip);
  const wobAdd = extra("wob", mic * 34, note * 34, 0.5, 0.5, 20, lean, tip);
  const angAdd = extra("ang", mic * 120, noteHue, 4, 4, 220, lean, tip);
  const grid = clamp(Math.round(S.grid + gridAdd), 4, 48);
  const thresh = clamp(Math.round(S.thresh + threshAdd), 0, 255);
  const hue = (S.hue + hueAdd + 3600) % 360;
  const wob = clamp(S.wob + wobAdd, -40, 40);
  const ang = wrapSigned(S.ang + angAdd, 180);
  return {roll:r, pitch:tip, lean, tip, spin, mic, note:noteHue, grid, thresh, hue, wob, ang,
    add:{grid:grid-S.grid, thresh:thresh-S.thresh, hue:hueAdd, wob:wob-S.wob, ang:angAdd}};
}

function setup(){
  const c = createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  colorMode(HSB, 360, 100, 100, 255);
  noStroke();
  frameRate(30);
  c.canvas.style.display = "none";
}
function windowResized(){
  pixelDensity(1);
  resizeCanvas(windowWidth, windowHeight);
}

async function startMic(){
  if(micOn) return;
  const ctx = new AudioContext();
  await ctx.resume();
  const stream = await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}
  });
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  src.connect(analyser);
  micBuf = new Uint8Array(analyser.fftSize);
  wave = new Uint8Array(180);
  micOn = true;
}
function readMic(){
  if(!analyser) return;
  analyser.getByteTimeDomainData(micBuf);
  let sum = 0;
  for(let i = 0; i < micBuf.length; i++){
    const v = (micBuf[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / micBuf.length);
  const n = clamp((rms - 0.012) * 14, 0, 1);
  micLevel += (n - micLevel) * 0.45;
  if(wave.length){
    wave.copyWithin(0, 1);
    wave[wave.length - 1] = Math.round(micLevel * 255);
  }
  readPitch();
}

// One trip around the hue wheel is one octave, then the colors repeat.
// C (do) is the start of the wheel, so every C is the same color. The slider rotates that color.
const NOTE_C = 261.6256;
function easeHue(from, to, k){
  const delta = ((to - from) % 360 + 540) % 360 - 180;
  return (from + delta * k + 3600) % 360;
}
function readPitch(){
  if(micLevel < 0.07 || micBuf.length < 64) return;
  const rate = analyser.context.sampleRate;
  const n = micBuf.length;
  const minLag = Math.max(2, Math.floor(rate / 1400));
  const maxLag = Math.min(n - 2, Math.floor(rate / 70));
  const score = (lag) => {
    let corr = 0;
    for(let i = 0; i < n - lag; i += 2) corr += (micBuf[i] - 128) * (micBuf[i + lag] - 128);
    return corr / ((n - lag) / 2);
  };
  let energy = 0;
  for(let i = 0; i < n; i += 2){
    const a = micBuf[i] - 128;
    energy += a * a;
  }
  energy /= n / 2;
  if(energy < 12) return;
  // The first correlation peak is the note. Earlier lags look similar only because the wave has not turned around yet.
  const corr = new Float32Array(maxLag + 2);
  for(let lag = minLag - 1; lag <= maxLag + 1 && lag < n - 2; lag++){
    if(lag > 0) corr[lag] = score(lag);
  }
  let lag = 0;
  for(let i = minLag; i <= maxLag; i++){
    if(corr[i] >= corr[i - 1] && corr[i] > corr[i + 1] && corr[i] > energy * 0.35){
      lag = i;
      break;
    }
  }
  if(!lag) return;
  const freq = rate / lag;
  const within = ((Math.log2(freq / NOTE_C) % 1) + 1) % 1;
  noteHue = easeHue(noteHue, within * 360, 0.45);
}

function startCam(){
  document.getElementById("go").style.display = "none";
  document.querySelector("canvas").style.display = "block";
  const root = document.documentElement;
  if(root.requestFullscreen) root.requestFullscreen().catch(()=>{});
  video = createCapture(VIDEO, () => { started = true; });
  video.size(160, 120);
  video.hide();
  startMic().catch(() => { micOn = false; });
}

function draw(){
  readMic();
  const L = inputs();
  if(millis() - lastLive > 120){
    lastLive = millis();
    bus.postMessage({type:"live", mic:L.mic, roll, pitch, lean:L.lean, tip:L.tip, spin:L.spin, add:L.add, mode:S.mode, tiltZero});
  }
  if(!started || !video || video.width === 0){
    background(0);
    return;
  }
  background(S.inv ? 100 : 0, 0, S.inv ? 100 : 0);
  video.loadPixels();
  if(video.pixels.length === 0) return;

  const g = L.grid;
  const cols = Math.max(1, Math.floor(width / g));
  const rows = Math.max(1, Math.floor(height / g));
  const punch = micArm.wob ? (0.7 + L.mic * 0.85) : 1;

  for(let y = 0; y < rows; y++){
    for(let x = 0; x < cols; x++){
      if(S.mode >= 4){
        drawPose(S.mode, x, y, g, L, cols, rows);
        continue;
      }
      let sx = S.mir ? (cols - 1 - x) : x;
      let vx = Math.floor(sx / cols * video.width);
      let vy = Math.floor(y / rows * video.height);
      let i = (vy * video.width + vx) * 4;
      let r = video.pixels[i], gc = video.pixels[i+1], b = video.pixels[i+2];
      let bright = (r + gc + b) / 3;
      if(S.inv) bright = 255 - bright;
      let [px, py] = cellPos(x, y, g, L, cols, rows);
      let hue = (bright / 255 * 160 + 200 + L.hue) % 360;

      if(S.mode === 0){
        if(bright > L.thresh){
          fill(hue, 70, 100);
          const d = (1 + (bright - L.thresh) / (255 - L.thresh + 1) * (g - 1)) * punch;
          ellipse(px, py, d, d);
        }
      } else if(S.mode === 1){
        const cr = (r + L.hue) % 256;
        colorMode(RGB, 255);
        fill(cr, gc, b);
        colorMode(HSB, 360, 100, 100, 255);
        const s = Math.max(2, (g - 1) * punch);
        rect(px - s/2, py - s/2, s, s);
      } else if(S.mode === 2){
        let i2 = (vy * video.width + Math.min(vx+1, video.width-1)) * 4;
        let nb = (video.pixels[i2] + video.pixels[i2+1] + video.pixels[i2+2]) / 3;
        let edge = Math.abs(bright - nb);
        if(edge > L.thresh / 4){
          fill((edge * 2 + L.hue) % 360, 90, 100);
          ellipse(px, py, g * 0.9 * punch, g * 0.9 * punch);
        }
      } else {
        fill(hue, 80, bright > L.thresh ? 100 : 40);
        rect(px - g * punch / 4, py - g * punch / 4, g * punch / 2, g * punch / 2);
        rect(width - px - g * punch / 4, py - g * punch / 4, g * punch / 2, g * punch / 2);
      }
    }
  }
  sendMatrix();
  drawHUD(L);
}

// Same axes as the bubble: pitch moves right, lean moves down. The sample
// is signed so the picture travels with the dot, including when mirrored.
function drawPan(x, y, g, L, cols, rows){
  const zoom = 0.68;
  const nx = (S.mir ? (cols - 1 - x) : x) / cols - 0.5;
  const ny = y / rows - 0.5;
  const look = S.mir ? 1 : -1;
  const cam = camAt(0.5 + nx * zoom + look * sway(L.pitch) * 0.16, 0.5 + ny * zoom - sway(L.lean) * 0.16);
  const [px, py] = gridPos(x, y, g, L);
  const s = Math.max(2, (g - 2) * (micArm.wob ? (0.7 + L.mic * 0.85) : 1));
  const dim = cam.bright > L.thresh ? 1 : 0.35;
  paintBlock(px, py, s, cam.r * dim, cam.g * dim, cam.b * dim);
}

// Vertical cut that tracks the bubble. Pitch slides it right. Lean rotates it
// as the bubble travels down.
function drawHorizon(x, y, g, L, cols, rows){
  const ang = -sway(L.lean) * 0.9;
  const nx = Math.sin(ang), ny = -Math.cos(ang);
  const side = (y / rows - 0.5) * nx + (x / cols - 0.5) * ny + sway(L.pitch) * 0.36;
  const sx = S.mir ? (cols - 1 - x) : x;
  const cam = camAt(sx / cols, y / rows);
  const [px, py] = gridPos(x, y, g, L);
  const s = Math.max(2, g - 2);
  if(Math.abs(side) < 0.028){
    fill(L.hue, 70, 100);
    rect(px - s / 2, py - s / 2, s, s);
    return;
  }
  const dim = side > 0 ? 1 : (cam.bright > L.thresh ? 0.42 : 0.12);
  paintBlock(px, py, s, cam.r * dim, cam.g * dim, cam.b * dim);
}

// Pitch sets how many folds. Lean rotates them.
function drawWedges(x, y, g, L, cols, rows){
  const slices = clamp(6 + Math.round(sway(L.tip) * 4), 3, 12);
  let dx = x / cols - 0.5;
  const dy = y / rows - 0.5;
  if(S.mir) dx = -dx;
  let ang = Math.atan2(dy, dx) + sway(L.lean) * 1.2;
  const slice = Math.PI * 2 / slices;
  let folded = ((ang % slice) + slice) % slice;
  if(folded > slice / 2) folded = slice - folded;
  const rad = Math.min(1, Math.hypot(dx, dy) / 0.55);
  const cam = camAt(0.5 + Math.cos(folded) * rad * 0.5, 0.5 + Math.sin(folded) * rad * 0.5);
  const [px, py] = cellPos(x, y, g, L, cols, rows);
  const s = Math.max(2, (g - 2) * (micArm.wob ? (0.7 + L.mic * 0.85) : 1));
  paintBlock(px, py, s, cam.r, cam.g, cam.b);
}

function drawPose(mode, x, y, g, L, cols, rows){
  Lhue = L.hue;
  if(mode === 4) drawPan(x, y, g, L, cols, rows);
  else if(mode === 5) drawHorizon(x, y, g, L, cols, rows);
  else drawWedges(x, y, g, L, cols, rows);
}

function packDot(r, g, b){
  const peak = Math.max(r, g, b);
  if(peak < 28) return 0;
  // Keep the hue and stop every channel sitting at full scale (that painted the panel white).
  const scale = 150 / peak;
  r = Math.min(255, r * scale);
  g = Math.min(255, g * scale);
  b = Math.min(255, b * scale);
  return ((r >> 5) << 5) | ((g >> 5) << 2) | (b >> 6);
}

function sendMatrix(){
  if(millis() - lastFrame < 140 || frameBusy || !started) return;
  lastFrame = millis();
  const data = drawingContext.getImageData(0, 0, width, height).data;
  const buf = new Uint8Array(16 * 12);
  const stride = width * 4;
  const cellW = width / 16, cellH = height / 12;
  for(let y = 0; y < 12; y++){
    const y0 = Math.floor(y * cellH);
    const y1 = Math.max(y0 + 1, Math.floor((y + 1) * cellH));
    const stepY = Math.max(1, Math.floor((y1 - y0) / 6));
    for(let x = 0; x < 16; x++){
      const x0 = Math.floor(x * cellW);
      const x1 = Math.max(x0 + 1, Math.floor((x + 1) * cellW));
      const stepX = Math.max(1, Math.floor((x1 - x0) / 6));
      let br = 0, bg = 0, bb = 0, peak = 0;
      for(let py = y0; py < y1; py += stepY){
        for(let px = x0; px < x1; px += stepX){
          const i = py * stride + px * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const p = r + g + b;
          if(p > peak){ peak = p; br = r; bg = g; bb = b; }
        }
      }
      buf[y * 16 + x] = packDot(br, bg, bb);
    }
  }
  frameBusy = true;
  fetch("/m5/frame", {method:"POST", body:buf}).catch(()=>{}).finally(() => { frameBusy = false; });
}

function drawHUD(L){
  const y0 = height - 108;
  fill(0, 0, 0, 190);
  rect(0, y0, width, 108);
  fill(0, 0, 100);
  textSize(15);
  textFont("monospace");
  const who = (store) => {
    const names = {grid:"grid", thresh:"thresh", hue:"hue", wob:"wob", ang:"angle"};
    const hit = Object.keys(names).filter(k => store[k]).map(k => names[k]);
    return hit.length ? hit.join(" ") : "off";
  };
  const rows = [
    ["mic", L.mic, "wobble", Math.round(S.wob), Math.round(L.add.wob)],
    ["pitch", L.note / 360, "hueShift", Math.round(S.hue), Math.round(L.add.hue)],
    ["lean", (L.lean / 40 + 1) / 2, who(leanArm), 0, 0, "who"],
    ["gyro", L.spin, who(gyroArm), 0, 0, "who"]
  ];
  rows.forEach((row, i) => {
    const y = y0 + 14 + i * 24;
    fill(0, 0, 70);
    text(row[0], 16, y + 12);
    fill(0, 0, 20);
    rect(90, y, 140, 12, 3);
    if(row[0] === "mic") fill(0, 80, 100); else fill(150, 40, 100);
    rect(90, y, 140 * clamp(row[1], 0, 1), 12, 3);
    fill(0, 0, 100);
    const sign = row[4] >= 0 ? "+" : "";
    const label = row[5] === "who"
      ? row[2]
      : row[2] + "  " + row[3] + " " + sign + row[4] + "   = " + (row[3] + row[4]);
    text(label, 248, y + 12);
  });

  // mic trace
  fill(0, 0, 0, 160);
  rect(width - 200, 16, 184, 56, 6);
  stroke(0, 80, 100);
  noFill();
  beginShape();
  for(let i = 0; i < wave.length; i++){
    vertex(width - 192 + i, 64 - (wave[i] / 255) * 40);
  }
  endShape();
  noStroke();
  fill(0, 0, 100);
  textSize(12);
  text("pitch → hue", width - 192, 30);

  // spirit level for tilt
  const cx = 70, cy = 48;
  fill(0, 0, 0, 160);
  rect(16, 16, 108, 72, 6);
  noFill();
  stroke(0, 0, 40);
  ellipse(cx, cy, 52, 52);
  noStroke();
  fill(150, 50, 100);
  const bx = cx + clamp(L.pitch, -28, 28);
  const by = cy + clamp(L.lean, -28, 28);
  ellipse(bx, by, 14, 14);
  fill(0, 0, 100);
  textSize(11);
  text(modeNames[S.mode] || "", 22, 28);
}

function applyState(m){
  if(m.grid != null) S.grid = m.grid;
  if(m.thresh != null) S.thresh = m.thresh;
  if(m.hue != null) S.hue = m.hue;
  if(m.wob != null) S.wob = m.wob;
  if(m.ang != null) S.ang = m.ang;
  if(m.mir != null) S.mir = !!m.mir;
  if(m.inv != null) S.inv = !!m.inv;
  if(m.mode != null) S.mode = m.mode;
  if(m.micArm) Object.assign(micArm, m.micArm);
  if(m.pitchArm) Object.assign(pitchArm, m.pitchArm);
  if(m.leanArm) Object.assign(leanArm, m.leanArm);
  if(m.tiltArm) Object.assign(tiltArm, m.tiltArm);
  if(m.gyroArm) Object.assign(gyroArm, m.gyroArm);
  if("tiltZero" in m) tiltZero = m.tiltZero;
}
function zeroTilt(){
  tiltZero = {roll, pitch};
  bus.postMessage({type:"tiltZero", tiltZero});
}
bus.onmessage = (e) => {
  const m = e.data || {};
  if(m.type === "state") applyState(m);
  if(m.type === "zeroTilt") zeroTilt();
  if(m.type === "cam" && !started) startCam();
  if(m.type === "wantMic") startMic().catch(()=>{});
};
bus.postMessage({type:"stage"});

function applyM5(line){
  const p = line.trim().split(/\s+/);
  if(p[0] !== "pm") return;
  if((p[1] === "tilt" || p[1] === "imu") && p.length >= 7){
    if(p[1] !== "tilt") return;
    roll = +p[2];
    pitch = +p[3];
    spin = Math.min(1, Math.hypot(+p[4], +p[5], +p[6]) / 140);
    return;
  }
  if(p[1] === "cam"){ if(!started) startCam(); return; }
  if(p[1] !== "set" || p.length < 4) return;
  const key = p[2], val = Number(p[3]);
  if(Number.isNaN(val)) return;
  if(key === "mode") S.mode = ((val % modeNames.length) + modeNames.length) % modeNames.length;
  else if(key === "mir") S.mir = val !== 0;
  else if(key === "inv") S.inv = val !== 0;
  else if(key in S) S[key] = val;
}
function connectM5(){
  const es = new EventSource("/m5/events");
  es.onmessage = (e) => applyM5(e.data);
}
connectM5();
document.getElementById("start").onclick = startCam;
</script>
</body>
</html>
